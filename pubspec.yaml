name: localai
description: "Lightweight Local first offline AI chat platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  async: ^2.11.0
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  device_info_plus: ^11.2.0
  dio: ^5.7.0
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  dropdown_button2: ^3.1.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_markdown_plus: ^1.0.6
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  go_router: ^15.1.0
  highlight: ^0.7.0
  json_annotation: ^4.9.0
  markdown: ^7.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/localai_icon.png

flutter_launcher_icons:
  image_path: "assets/icon/localai_icon.png"

  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    image_path: "assets/icon/localai_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/localai_icon.png"